name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./finanz-tracker
          push: true
          platforms: linux/arm64
          tags: ghcr.io/samsonites86/ha-finanz-tracker-aarch64:latest,ghcr.io/samsonites86/ha-finanz-tracker-aarch64:1.1.1
          build-args: BUILD_FROM=alpine:3.18
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./finanz-tracker
          push: true
          platforms: linux/amd64
          tags: ghcr.io/samsonites86/ha-finanz-tracker-amd64:latest,ghcr.io/samsonites86/ha-finanz-tracker-amd64:1.1.1
          build-args: BUILD_FROM=alpine:3.18
